version: '3.8'

services:
  mimovision:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: mimovision-agent
    ports:
      - "8080:8080"
    env_file:
      - ../config/.env
    volumes:
      - ../config:/app/config
      - ../output:/app/output
      - ../logs:/app/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
